# CI workflow — Deterministic Hygiene Gates + Stack Lint · Typecheck · Test · Build
# Supply-chain rule (OWASP A03:2025): ALL third-party actions MUST be pinned to 40-char SHAs.
# Quote any run: value containing ": " (a colon then a space) so YAML parses cleanly.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene-gates:
    name: Hygiene & Canonical AI Doc Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Run deterministic hygiene gates (repo + PR diff ratchets)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            python3 scripts/check_hygiene_gates.py --diff-base "origin/$BASE_REF"
          else
            python3 scripts/check_hygiene_gates.py
          fi

  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [hygiene-gates]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── Setup (replace with your stack — ALWAYS keep full 40-char commit SHA) ──
