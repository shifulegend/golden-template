# Pre-commit hooks — Control 6.1 (shift-left formatting, syntax, secrets & hygiene)
# Install locally: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: code-hygiene-gates
        name: Deterministic Code Hygiene & Canonical AI Doc Gates
        entry: python3 scripts/check_hygiene_gates.py
        language: system
        pass_filenames: false
        always_run: true
