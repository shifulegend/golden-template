      # Go:     uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      - name: Setup (TODO — replace for your stack)
        run: echo "Add your SHA-pinned runtime setup here"

      - name: Install dependencies (frozen lockfile — Control 6.5)
        run: 'echo "TODO: npm ci | uv sync --frozen | go mod download"'

      - name: Format, Lint & Complexity Gates (Controls 3.2, 3.3, 6.1)
        run: 'echo "TODO: npm run lint | ruff check . | golangci-lint run"'

      - name: Strict Typecheck (Control 3.1.4 — 0 errors, no any)
        run: 'echo "TODO: npx tsc --noEmit | mypy --strict . | go vet ./..."'

      - name: Acyclic Dependency & Duplication Gate (<3% new code — Controls 1.1, 2.7)
        run: 'echo "TODO: npx madge --circular src/ && npx jscpd --threshold 3 src/"'

      - name: Deterministic Tests & Race Detector (Controls 3.2.4, 5.4)
